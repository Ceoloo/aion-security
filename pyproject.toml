[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-security"
version = "0.1.0"
description = "AION security satellite: Continuous Assurance runners, evidence packaging, gated red harnesses."
requires-python = ">=3.11"
dependencies = []  # stdlib only; connectors that need SDKs declare optional extras

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aion-security = "aion_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion_security = ["blue/controls.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
